apiVersion: v1
kind: Service
metadata:
  name: devboard-frontend-service
  namespace: devboard
spec:
  selector:
    app: devboard-frontend
  ports:
    - protocol: TCP
      port: 8080 # Expose Port
      targetPort: 4173 # Pod Port 
      nodePort: 30080 # Node Port (Cluster Port)
  type: NodePort
